[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor-cli"
version = "0.1.0"
description = "CLI for the auditor-in-a-TEE multi-party computation service"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25",
    "cryptography>=41",
    "pyyaml>=6",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.scripts]
auditor = "auditor_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditor_cli = ["templates/*.yaml"]
