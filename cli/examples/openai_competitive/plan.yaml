name: "OpenAI Competitive Intelligence (blocked example)"
user1_public_key: "__ALICE_PK__"
user2_public_key: "__OPENAI_PK__"

data1_format:
  description: >-
    JSON object with "user" (opaque participant id) and "messages" — an
    array of { "text": <user message>, "prior": <optional prior context> }.
  schema_hint: "json"

data2_format:
  description: >-
    JSON object with "researcher" and "classifiers" — a subset of
    ["work_nonwork", "asking_doing_expressing", "conversation_topic"]
    from Appendix A of the paper.
  schema_hint: "json"

steps:
  # ------------------------------------------------------------------
  # step 0 — Monitoring Policy Check (reusable)
  #
  # Audits the RESEARCHER'S SPEC (data2) against the published policy
  # for acceptable analysis. Emits exactly:
  #   VALID                           — spec is within policy
  #   INVALID: <one-line reason>      — spec violates a named rule
  #
  # The constitution below is the policy itself. It's copy-pasteable
  # into any plan that wants monitoring-policy enforcement.
  # ------------------------------------------------------------------
  - type: run_llm
    model: "gemma4-31b"
    constitution: |
      preamble: |
        Monitoring Policy for researcher queries run against a user's
        private chatbot messages inside a TEE. The purpose of this
        system is to enable HIGH-LEVEL, AGGREGATE STATISTICAL analysis
        of usage patterns — the kind of research published in papers
        like "How People Use ChatGPT" — while structurally preventing
        per-user profiling, surveillance, competitive intelligence, or
        content extraction. The sentinel below audits whether the
        researcher's spec fits this purpose. It emits ONLY a verdict;
        it never executes the requested analysis itself.

      rules:
        - id: aggregate_only
          description: "Queries must describe distributions, frequencies, or proportions across a population — never per-individual outputs."
          details: "Allowed: '% of messages that are work-related', 'distribution of topics across messages'. Rejected: anything producing a per-user record, per-message label in the output, or any output that preserves the original ordering or identity of inputs."
        - id: no_individual_profiling
          description: "No query may single out, flag, rank, or score specific users or messages."
          details: "Phrases like 'for each user', 'which users', 'identify users who', 'flag messages that', 'rank by', 'score this user on' are rejected. Research is about populations, not individuals."
        - id: no_content_extraction
          description: "No query may extract the content, substance, topic keywords, or named entities from user messages."
          details: "Only categorical labels from a pre-published taxonomy (Appendix A of the paper) are permitted. Rejected: extracting product names, company names, people, places, dates, keywords, or any free text; paraphrasing messages; summarizing the 'most common things users ask about' beyond the approved categories."
        - id: no_competitive_intelligence
          description: "No query may seek information that could provide commercial or competitive advantage."
          details: "Rejected: detecting mentions of competing products or companies, purchase intent, brand preferences, price sensitivity, defection risk, feature requests directed at competitors, or any market-research signal tied back to this user population."
        - id: no_surveillance_or_monitoring
          description: "No query may monitor, track, or flag behavior in ways that could harm users."
          details: "Rejected: detecting political views, mental-health state, legal exposure, employment risk, drug/alcohol use, relationship status, immigration status, protected-class membership, intent to self-harm, or any behavioral risk assessment."
        - id: no_sensitive_attribute_inference
          description: "No query may attempt to infer sensitive or protected attributes about users."
          details: "Rejected: inferring age, gender identity, sexual orientation, race/ethnicity, religion, disability, income, health conditions, or any other protected characteristic from the messages."
        - id: approved_classifier_set_only
          description: "Any named classifier must come from the published Appendix A set."
          details: "Permitted classifier ids: work_nonwork, asking_doing_expressing, conversation_topic. Ad-hoc classifiers, custom taxonomies, or any field that looks like a classifier name but isn't on this list is rejected."
        - id: purpose_limitation
          description: "The stated purpose must be consistent with published economic/usage research."
          details: "A 'researcher' field identifying an academic or published-research context is expected. Purposes like 'product targeting', 'sales intelligence', 'safety intervention', 'moderation', or 'growth analysis' are rejected — those may be legitimate elsewhere but are not what this system authorizes."
        - id: verdict_only
          description: "The monitoring policy node must output only the verdict line."
          details: "On VALID: the single word VALID. On INVALID: 'INVALID: <one-line reason naming the rule that was violated>'. No commentary, no echo of the reviewed spec, no list of problems — just the single verdict line."

    prompt: |
      You are the Monitoring Policy sentinel for a privacy-preserving
      research TEE. You audit the RESEARCHER'S SPEC against the
      CONSTITUTION and emit a single-line verdict. You never execute
      any analysis.

      CONSTITUTION:
      {constitution}

      RESEARCHER SPEC TO AUDIT:
      {data2}

      For each rule, check the spec carefully:
      1. aggregate_only                  — does the spec ask for per-user/per-message output?
      2. no_individual_profiling         — any "identify users who...", "flag users", "rank"?
      3. no_content_extraction           — any request to extract keywords, entities, or topics beyond approved classifiers?
      4. no_competitive_intelligence     — any competitor, product, brand, purchase-intent signal?
      5. no_surveillance_or_monitoring   — any behavioral/risk/safety flagging?
      6. no_sensitive_attribute_inference — any protected attribute inference?
      7. approved_classifier_set_only    — any classifier id outside {work_nonwork, asking_doing_expressing, conversation_topic}?
      8. purpose_limitation              — does the stated purpose fit aggregate usage research?

      Respond with EXACTLY one line, nothing else:

        VALID

      — or —

        INVALID: <short specific reason naming the rule that was violated>

      Do NOT quote, echo, or summarize the reviewed spec.

  # ------------------------------------------------------------------
  # step 1 — Classifiers (Appendix A of the paper).
  # If the policy sentinel rejected the spec, this step emits BLOCKED
  # instead of running the classifiers.
  # ------------------------------------------------------------------
  - type: run_llm
    model: "gemma4-31b"
    constitution: |
      preamble: |
        Privacy-preserving replication of Appendix A classifiers from
        "How People Use ChatGPT" (OpenAI Economic Research, 2025). A user
        shares their ChatGPT user-messages; an OpenAI researcher selects
        which classifiers to apply. The TEE runs them in an enclave and
        returns only aggregate label counts.

      rules:
        - id: paper_prompts_only
          description: "Only the three published classifier prompts from Appendix A may be used."
        - id: no_message_content
          description: "No user message text, quotes, or paraphrases may appear in results."
        - id: k_anonymity
          description: "Any label with fewer than 3 messages must be suppressed as '<3'."
        - id: no_identifiers
          description: "No message ids, positions, timestamps, or user info in output."
        - id: honor_upstream_policy
          description: "If the upstream policy sentinel rejected the spec, emit BLOCKED and run nothing."

    prompt: |
      You are a classifier pipeline running inside a Trusted Execution
      Environment, replicating three message classifiers from Appendix A of
      the paper "How People Use ChatGPT" (Chatterji et al., 2025).

      UPSTREAM MONITORING POLICY VERDICT (from step 0):
      {step_0_output}

      If that verdict begins with "INVALID", output ONLY this line and stop:
        BLOCKED: upstream monitoring policy rejected the spec.

      Otherwise, proceed with the classifier run described below.

      CONSTITUTION (both parties agreed):
      {constitution}

      PRIVATE USER MESSAGES (read to classify; NEVER echo, quote, or paraphrase):
      {data1}

      RESEARCHER SPEC:
      {data2}

      ================================================================
      CLASSIFIER PROMPTS — use verbatim, exactly as published in the paper
      ================================================================

      --- A.1  Work / Non-Work ---
      You are an internal tool that classifies a message from a user to an AI
      chatbot, based on the context of the previous messages before it.

      Does the last user message of this conversation transcript seem likely to
      be related to doing some work/employment? Answer with one of the following:

        (1) likely part of work (e.g. "rewrite this HR complaint")
        (0) likely not part of work (e.g. "does ice reduce pimples?")

      In your response, only give the number and no other text.

      --- A.2  Asking / Doing / Expressing ---
      Assign the last user message to one of the following three categories:

      - Asking: seeking information or advice (e.g. "Who was president after
        Lincoln?", "How do I create a budget for this quarter?").
      - Doing: requesting that ChatGPT perform tasks for the user — drafting
        an email, writing code, etc. (e.g. "Rewrite this email to make it
        more formal", "Write a Dockerfile for this app.").
      - Expressing: statements that are neither asking nor requesting a task.

      --- A.3  Conversation Topic ---
      Select the capability the user is clearly interested in, or `other`, or
      `unclear`. Categories:
        edit_or_critique_provided_text, argument_or_summary_generation,
        personal_writing_or_communication, write_fiction, how_to_advice,
        creative_ideation, tutoring_or_teaching, translation,
        mathematical_calculation, computer_programming, purchasable_products,
        cooking_and_recipes, health_fitness_beauty_or_self_care, specific_info,
        greetings_and_chitchat, relationships_and_personal_reflection,
        games_and_role_play, asking_about_the_model, create_an_image,
        analyze_an_image, generate_or_retrieve_other_media, data_analysis,
        unclear, other.

      If multiple capabilities apply, choose the one most relevant to the
      LAST message. Reply with one capability, all lower case with underscores.

      ================================================================
      INSTRUCTIONS
      ================================================================
      1. Validate `classifiers`. Unknown entries are ignored.
      2. For every message in `data1.messages`, run each requested classifier
         using the prompt text above, with "prior" as preceding context.
      3. Apply k-anonymity: any label with fewer than 3 messages → "<3".
      4. Output a Markdown report:

         # ChatGPT Usage Classification Report
         **Researcher:** <name>
         **Messages analyzed:** <N>
         **Classifiers run:** <list>
         **k-anonymity threshold:** 3

         ## Work vs Non-Work (paper §A.1)
         | Label | Count | % |
         |---|---|---|

         ## Asking / Doing / Expressing (paper §A.2)
         | Label | Count | % |
         |---|---|---|

         ## Conversation Topic (paper §A.3)
         | Topic | Count | % |
         |---|---|---|
         (sorted by count desc; suppressed buckets shown as `<3`)

         ---
         *Classifier prompts reproduced from Chatterji et al., "How People*
         *Use ChatGPT", Appendix A.*

      5. NEVER include any message text, prior context, user id, or index.
      6. On rule violation, output only: `BLOCKED: <short reason>`

  # ------------------------------------------------------------------
  # step 2 — Privacy Sentinel — reusable validator node.
  # Emits exactly one line: VALID  or  INVALID: <reason>.
  # Audits the classifier output (step 1) for privacy leaks.
  # ------------------------------------------------------------------
  - type: run_llm
    model: "gemma4-31b"
    constitution: |
      preamble: |
        Privacy sentinel running inside a TEE. Reviews the prior step's
        output and blocks release if it leaks private data. Emits only a
        VALID / INVALID verdict — never echoes reviewed content.

      rules:
        - id: no_pii
          description: "No personally identifiable information in the output."
        - id: k_anonymity_3
          description: "Any bucket smaller than 3 records must be suppressed."
        - id: no_raw_data
          description: "No raw source data may appear in the output."
        - id: no_identifiers
          description: "No per-record ids or positional info in the output."
        - id: verdict_only
          description: "The sentinel must output only the verdict line."

    prompt: |
      You are a privacy sentinel running inside a Trusted Execution
      Environment. Review the OUTPUT against the CONSTITUTION.

      CONSTITUTION:
      {constitution}

      OUTPUT TO REVIEW (from step 1, the classifier step):
      {step_1_output}

      Check every rule:
      1. no_pii         — any names, emails, phone numbers, addresses, handles?
      2. k_anonymity_3  — any visible count below 3? any un-suppressed small bucket?
      3. no_raw_data    — any verbatim or paraphrased user content?
      4. no_identifiers — any record ids, timestamps, or position indices?

      Respond with EXACTLY one line:

        VALID

      — or —

        INVALID: <short reason naming the rule that was violated>

      Do NOT repeat, summarize, or quote the reviewed output.

tinfoil_api_key: null
